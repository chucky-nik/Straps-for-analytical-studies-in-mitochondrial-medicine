[project]
name = "mito-harness"
version = "0.1.0"
description = "Harness for analytical studies in mitochondrial medicine (ANTEI × ITMO)"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.7.0",
  "tenacity>=8.2.0",
  "httpx>=0.27.0",
  "matplotlib>=3.8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
